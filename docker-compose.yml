services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/datagame
      PORT: 3001
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - game_images:/app/data/img
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./interface
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REACT_APP_API_URL: http://localhost:3001
      NODE_OPTIONS: --openssl-legacy-provider
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo_data:
  game_images:
